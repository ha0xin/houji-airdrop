[package]
name = "houji-owly-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
owly-awdl = { path = "../owly/crates/owly-awdl", features = ["driver"] }
owly-airdrop = { path = "../owly/crates/owly-airdrop", features = ["mdns"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
crc32fast = "1"
libc = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
