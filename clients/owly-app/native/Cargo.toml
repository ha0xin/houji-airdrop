[package]
name = "houji-owly-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
houji-runner = { path = "../../../native/houji-runner" }
owly-awdl = { path = "../../../native/owly/crates/owly-awdl", features = ["driver"] }
owly-airdrop = { path = "../../../native/owly/crates/owly-airdrop", features = ["mdns"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync"] }
